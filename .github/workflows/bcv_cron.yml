name: Automatizar Tasas BCV y USDT

on:
  schedule:
    #se ejecuta a las 07:00, 13:00 y 21:00 hora de Venezuela (convertido a UTC: 11:00, 17:00, 01:00)
    - cron: '0 11,17,1 * * *'
  
  #permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      #1 descargar tu código en el servidor temporal de GitHub
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      #2 configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      #3 instalar las librerias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 schedule beautifulsoup4 playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      #4 ejecutar tu script principal
      - name: Ejecutar script de scraping
        run: python ejecutar_script_git.py

      #5 guardar automáticamente los nuevos registros de SQLite de vuelta en el repositorio
      - name: Actualizar base de datos SQLite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tasas_historico.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar base de datos historica automatica" && git push)
