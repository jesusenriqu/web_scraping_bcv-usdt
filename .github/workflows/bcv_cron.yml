name: Automatizar Tasas BCV y USDT

on:
  schedule:
    #07:00, 13:00 y 21:00 hora de Venezuela (UTC-4) = 11:00, 17:00 y 01:00 UTC
    - cron: '13 6,11,17 * * *'

  #permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

#permiso para hacer push
permissions:
  contents: write

jobs:
  run-scraper:
    #fijado a una versión concreta para evitar cambios inesperados al migrar ubuntu-latest a Ubuntu 26
    runs-on: ubuntu-24.04

    steps:
      #1 descargar el código en el servidor temporal de GitHub
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      #2 configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      #3 instalar las librerías
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 schedule beautifulsoup4 playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # 4. ejecutar script principal
      - name: Ejecutar script de scraping
        run: python ejecutar_script_git.py

      #5 guardar los nuevos registros de SQLite de vuelta en el repositorio
      - name: Actualizar base de datos SQLite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tasas_historico.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar base de datos historica automatica"
            git push
          fi
